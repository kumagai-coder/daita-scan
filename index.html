<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代田ファクトリー 作業記録へ移動中</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #0a0a0a;
  color: #f5f5f0;
  font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
}
.box {
  width: min(90vw, 420px);
  padding: 28px 22px;
  border: 1px solid #333;
  border-radius: 14px;
  background: #1a1a1a;
  text-align: center;
}
.logo {
  color: #e8441a;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .18em;
  margin-bottom: 10px;
}
h1 {
  font-size: 20px;
  margin: 0 0 10px;
}
p {
  color: #aaa;
  font-size: 14px;
  line-height: 1.7;
  margin: 0;
}
a {
  display: inline-block;
  margin-top: 18px;
  color: #fff;
  background: #e8441a;
  padding: 13px 18px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 700;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">DAITA FACTORY</div>
  <h1>作業タイマーへ移動中</h1>
  <p id="message">案件番号を確認しています。</p>
  <a id="link" href="#" style="display:none">作業タイマーを開く</a>
</div>

<script>
const GAS_APP_URL = 'https://script.google.com/macros/s/AKfycby6rXFd0vbhRa6h-AcHeM38M5X0voIjdI5NR5upx6behjToGAVwdWfxNqa_fACRPLNO-A/exec';

function getAnkenNo() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || params.get('anken') || '';
}

function redirectToGas() {
  const ankenNo = getAnkenNo();
  const url = ankenNo
    ? GAS_APP_URL + '?id=' + encodeURIComponent(ankenNo)
    : GAS_APP_URL;

  const link = document.getElementById('link');
  link.href = url;
  link.style.display = 'inline-block';

  document.getElementById('message').textContent = ankenNo
    ? '案件番号 ' + ankenNo + ' を作業タイマーで開きます。'
    : '作業タイマーを開きます。';

  window.location.replace(url);
}
#githab
redirectToGas();
</script>
</body>
</html>
